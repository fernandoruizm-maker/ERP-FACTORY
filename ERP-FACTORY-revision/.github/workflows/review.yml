{
  "name": "Revision privada V2 multiparte (bloqueada)",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "source_sha": {
          "description": "SHA completo PUBLICO autorizado",
          "required": true,
          "type": "string"
        },
        "authorize_anthropic": {
          "description": "Nueva autorizacion expresa de envio y coste",
          "required": true,
          "type": "boolean",
          "default": false
        }
      }
    }
  },
  "permissions": {},
  "concurrency": {
    "group": "private-factory-review",
    "cancel-in-progress": false
  },
  "jobs": {
    "review": {
      "if": "${{ false && github.event.repository.private == true && github.repository == 'fernandoruizm-maker/ERP-FACTORY-revision' && github.ref == 'refs/heads/main' && github.actor_id == '342326625' && github.triggering_actor == 'fernandoruizm-maker' && github.run_attempt == 1 && inputs.authorize_anthropic == true }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 120,
      "permissions": {
        "contents": "read"
      },
      "env": {
        "TRUSTED_REVIEWER_SHA": "0000000000000000000000000000000000000000",
        "INPUT_SOURCE_SHA": "${{ inputs.source_sha }}",
        "REPOSITORY_PRIVATE": "${{ github.event.repository.private }}",
        "TRIGGERING_ACTOR": "${{ github.triggering_actor }}",
        "AUTHORIZE_ANTHROPIC": "${{ inputs.authorize_anthropic }}",
        "WORKFLOW_SHA": "${{ github.workflow_sha }}",
        "REVIEW_WORKDIR": "${{ runner.temp }}/private-review"
      },
      "steps": [
        {
          "name": "Validador privado fijado, nunca checkout publico",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "timeout-minutes": 2,
          "with": {
            "repository": "fernandoruizm-maker/ERP-FACTORY-revision",
            "ref": "0000000000000000000000000000000000000000",
            "path": "trusted",
            "persist-credentials": false
          }
        },
        {
          "id": "preflight",
          "name": "Verificar bloqueos, procedencia y topes",
          "timeout-minutes": 1,
          "run": "python3 -I -B trusted/entrypoint.py mp-preflight"
        },
        {
          "id": "prepare",
          "name": "Material publico solo como datos y presupuesto reservado",
          "timeout-minutes": 3,
          "run": "python3 -I -B trusted/entrypoint.py mp-init"
        },
        {
          "id": "upload_initial",
          "name": "Conservar checkpoint privado upload_initial",
          "if": "${{ always() && steps.prepare.outcome == 'success' }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "timeout-minutes": 1,
          "with": {
            "name": "review-${{ github.run_id }}-${{ github.run_attempt }}-upload_initial",
            "path": "${{ runner.temp }}/private-review/checkpoints/initial/artifacts/",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        },
        {
          "id": "select_1",
          "name": "Preparar y reservar llamada 1",
          "if": "${{ success() && steps.upload_initial.outcome == 'success' }}",
          "timeout-minutes": 1,
          "env": {
            "STATE_FILE": "${{ steps.prepare.outputs.state_file }}",
            "STATE_SHA256": "${{ steps.prepare.outputs.state_sha256 }}"
          },
          "run": "python3 -I -B trusted/entrypoint.py mp-select --slot 1"
        },
        {
          "id": "upload_reserved_1",
          "name": "Conservar checkpoint privado upload_reserved_1",
          "if": "${{ always() && steps.select_1.outcome == 'success' }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "timeout-minutes": 1,
          "with": {
            "name": "review-${{ github.run_id }}-${{ github.run_attempt }}-upload_reserved_1",
            "path": "${{ runner.temp }}/private-review/checkpoints/${{ steps.select_1.outputs.checkpoint }}/artifacts/",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        },
        {
          "id": "claude_1",
          "name": "Claude sin herramientas, llamada 1",
          "if": "${{ success() && steps.select_1.outputs.ready == 'true' && steps.upload_reserved_1.outcome == 'success' }}",
          "timeout-minutes": 6,
          "uses": "anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c",
          "with": {
            "github_token": "${{ github.token }}",
            "claude_code_oauth_token": "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}",
            "prompt": "${{ steps.select_1.outputs.user_prompt }}",
            "claude_args": "--safe-mode --disallowedTools \"*\" --max-turns 2 --max-budget-usd ${{ steps.select_1.outputs.max_budget_usd }} --model sonnet --append-system-prompt-file ${{ runner.temp }}/private-review/input/system.txt",
            "show_full_output": "false",
            "display_report": "false",
            "classify_inline_comments": "false",
            "include_fix_links": "false"
          }
        },
        {
          "id": "collect_1",
          "name": "Validar y guardar inmediatamente llamada 1",
          "if": "${{ always() && steps.select_1.outputs.ready == 'true' }}",
          "timeout-minutes": 1,
          "env": {
            "STATE_FILE": "${{ steps.select_1.outputs.state_file }}",
            "STATE_SHA256": "${{ steps.select_1.outputs.state_sha256 }}",
            "CLAUDE_CONCLUSION": "${{ steps.claude_1.outcome }}"
          },
          "run": "python3 -I -B trusted/entrypoint.py mp-collect --slot 1"
        },
        {
          "id": "upload_result_1",
          "name": "Conservar checkpoint privado upload_result_1",
          "if": "${{ always() && steps.collect_1.outputs.checkpoint != '' }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "timeout-minutes": 1,
          "with": {
            "name": "review-${{ github.run_id }}-${{ github.run_attempt }}-upload_result_1",
            "path": "${{ runner.temp }}/private-review/checkpoints/${{ steps.collect_1.outputs.checkpoint }}/artifacts/",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        },
        {
          "id": "select_2",
          "name": "Preparar y reservar llamada 2",
          "if": "${{ success() && steps.upload_result_1.outcome == 'success' && steps.collect_1.outputs.continue == 'true' }}",
